<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | Fluxer</title>
  <meta name="description" content="Fluxer builds SaaS products and delivers IT services. Home of MyFestivo.">
  <script>document.documentElement.classList.add("js")</script>
  <link href="/assets/juliett/Juliett-Regular.otf" rel="preload" as="font" type="font/otf" crossorigin>
  <link href="/assets/reversal/Reversal Bd.otf" rel="preload" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/assets/Fluxer%20site%20Icon.png">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/assets/Fulxer%20logo%20Transparent.svg" alt="Fluxer" class="brand-logo">
    </a>
    <button id="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Open navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav id="main-nav" aria-label="Main">
      <a href="/" data-p="home">Home</a>
      <a href="/products" data-p="products">Products</a>
      <a href="/services" data-p="services">Services</a>
      <a href="/about" data-p="about">About</a>
      <a href="/founders" data-p="founders">Founders</a>
    </nav>
    <a class="btn" href="/contact">Start a chat</a>
  </header>

  <main>
    <div class="pg" data-p="contact">
      <div class="contact-layout">
        <div class="contact-intro">
          <p class="lbl">Contact</p>
          <h1>Let's <span class="g">talk</span></h1>
          <div class="b">Tell us what you are working on. A rough idea is a fine place to start.</div>
        </div>

        <div class="contact-form-wrap">
          <div class="card">
            <div id="done"></div>
            <form id="f">
              <label>
                What is this about?
                <select>
                  <option>A project for my business</option>
                  <option>MyFestivo</option>
                  <option>Just saying hi</option>
                </select>
              </label>

              <label>
                Name
                <input id="nm" required autocomplete="name" placeholder="e.g. Alex Johnson">
              </label>

              <label>
                Email
                <input id="em" type="email" required autocomplete="email" placeholder="you@example.com">
              </label>

              <label>
                Message
                <textarea id="ms" required placeholder="Tell us what's on your mind…"></textarea>
              </label>

              <input type="checkbox" name="botcheck" id="botcheck" style="display:none" tabindex="-1" autocomplete="off">
              <button class="btn" type="submit">Send message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <site-footer></site-footer>

  <script>const PREVIEW=false</script>
  <script src="/app.js" defer></script>
</body>
</html>
